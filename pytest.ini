[pytest]
testpaths = tests
asyncio_mode = auto
pythonpath = .

# tests.win_compat must load before the pytest-homeassistant-custom-component
# entry-point plugin; see the docstring in tests/win_compat.py. It is inert on
# Linux and macOS. It stays first in addopts for that reason.
#
# ``-p no:cacheprovider`` used to be here and was removed in beta.42. It disabled
# the cache provider globally, which took ``--lf``, ``--ff`` and ``--sw`` with it --
# so after a failure the only way back was to rerun the selection from scratch.
# On a suite this size that was the single largest day-to-day cost. The mutation
# harnesses pass the flag themselves, where it belongs: they spawn one pytest per
# mutation and have no use for a cache written by a process that is about to be
# thrown away.
#
# ``--strict-markers`` makes a mistyped marker an error rather than a silent
# no-op. Registering the two below is what lets that be safe.
addopts = -p tests.win_compat --strict-markers

markers =
    slow: a test that costs seconds rather than milliseconds, and is excluded from the fast development tier. It is not excluded from any release gate.
    order_sensitive: a test that deliberately exercises ordering or worker-count behaviour, and must not be reordered or distributed away from its siblings.
